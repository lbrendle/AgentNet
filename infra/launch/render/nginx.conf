server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /u/ritz {
    return 301 /u/lmbrendle/;
  }

  location = /u/ritz/ {
    return 301 /u/lmbrendle/;
  }

  location ~ ^/u/([^/]+)/?$ {
    set $handle $1;
    try_files $uri $uri/ @profile;
  }

  location /u/ {
    try_files $uri $uri/ /u/index.html;
  }

  location @profile {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass https://agentindex-mainnet.onrender.com/profile/handle/$handle;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
