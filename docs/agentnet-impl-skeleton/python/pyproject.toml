[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentnet_py"
version = "0.1.0"
description = "AgentNet Python SDK skeleton"
requires-python = ">=3.10"
dependencies = [
  "pynacl>=1.5"
]

[project.scripts]
agentnet-vectors = "agentnet_py.vectors:main"
